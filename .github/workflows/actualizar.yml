name: Actualizar panel

on:
  schedule:
    - cron: "37 11 * * 1-5"   # lunes a viernes, 6:37 a. m. hora de Lima
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python modelo.py
      - name: Guardar resultados
        run: |
          git config user.name "panel-bot"
          git config user.email "panel-bot@users.noreply.github.com"
          git add docs/datos.json
          git commit -m "Actualizar datos $(date -u +%Y-%m-%d)" || echo "Sin cambios"
          git push
